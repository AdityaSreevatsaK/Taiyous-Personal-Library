name: Verify and deploy private staging
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/dev' && github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: npm install --no-fund --no-audit
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build static application
        run: npm run build
      - name: Check output for secrets and novel archives
        run: python scripts/check_deployment_package.py
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke test of compiled application
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_smoke.mjs
      - name: Recheck output after browser tests
        run: python scripts/check_deployment_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: staging-dist-${{ github.sha }}
          path: |
            dist/
            README.md
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      HF_OIDC_RESOURCE: spaces/AdityaSreevatsaK/Taiyous-Personal-Library-Staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: staging-dist-${{ github.sha }}
      - name: Install Hugging Face client
        run: python -m pip install 'huggingface_hub>=1.19,<2'
      - name: Recheck downloaded release package
        run: python scripts/check_deployment_package.py
      - name: Exchange GitHub OIDC identity for staging-only credentials
        shell: bash
        run: |
          token="$(hf auth token)"
          if [ -z "$token" ]; then
            echo 'Hugging Face Trusted Publisher is not configured or identity exchange failed.' >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy strictly to private staging Space
        run: python scripts/deploy_prebuilt.py
