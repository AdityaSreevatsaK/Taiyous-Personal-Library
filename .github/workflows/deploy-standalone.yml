name: Deploy Application
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy to production Cloudflare Pages (no version tag or release)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taiyou-standalone-pwa
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Type-check, unit tests and audit
        run: |
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build installable offline app
        run: npm run build
      - name: Check build contains no private data
        run: python scripts/check_deployment_package.py
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          # Avoid apt-get --with-deps: runner mirror DNS failures should not break browser checks.
          # ubuntu-24.04 hosted runners already include shared browser runtime libraries.
          npx playwright install chromium
      - name: Prove offline reload and reading with no network
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/taiyou-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_smoke.mjs
      - name: Stage security headers for standalone hosting only
        run: |
          cp scripts/standalone-headers.txt dist/_headers
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-pwa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: validate
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master' && inputs.publish == true
    runs-on: ubuntu-24.04
    environment: standalone-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Wrangler compiles the repository's functions/ folder when deployed
      # from the project root. The built dist/ artifact alone is insufficient.
      - name: Install Pages Function dependencies
        run: npm install --no-fund --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standalone-pwa-${{ github.sha }}
          path: dist
      - name: Require configured account, token and project
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CF_API_TOKEN'; exit 1; }
          test -n "$CF_PAGES_PROJECT" || { echo 'Missing CF_PAGES_PROJECT'; exit 1; }
      - name: Compile private Pages Function before deployment
        run: npx --yes wrangler@4 pages functions build functions --outfile /tmp/taiyou-functions.mjs --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat
      - name: Deploy master app and private API to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch master --commit-hash "${{ github.sha }}"

      # HF servers must fetch the client metadata without a Cloudflare Access
      # session. A successful upload alone cannot prove public OAuth is usable.
      - name: Verify deployed OAuth metadata is publicly accessible without Access
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = 'https://taiyous-personal-library.pages.dev/oauth-client.json';
          let last = 'no response';
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'manual', cache: 'no-store',
                signal: AbortSignal.timeout(15000), headers: { Accept: 'application/json' } });
              const next = response.headers.get('location') || '';
              if (response.status >= 300 && response.status < 400) {
                if (/cloudflareaccess\.com|\/cdn-cgi\/access\//i.test(next)) {
                  throw new Error('Cloudflare Access is intercepting the PUBLIC OAuth client metadata. In Cloudflare Zero Trust > Access > Applications, remove Access protection from taiyous-personal-library.pages.dev. Keep Access on previews if desired.');
                }
                last = 'HTTP redirect ' + response.status;
              } else {
                const type = response.headers.get('content-type') || '';
                const body = await response.text();
                if (response.status === 200 && type.toLowerCase().includes('application/json') &&
                    Buffer.byteLength(body) <= 5120 &&
                    JSON.parse(body).client_id === url) {
                  console.log('Production OAuth client metadata is publicly accessible: HTTP 200, JSON under 5 KiB.');
                  process.exit(0);
                }
                last = 'HTTP ' + response.status + ', Content-Type ' + type + ', size ' + Buffer.byteLength(body);
              }
            } catch (error) {
              if (String(error).includes('Cloudflare Access is intercepting')) {
                console.error('::error::' + String(error));
                process.exit(1);
              }
              last = String(error);
            }
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          console.error('::error::OAuth public metadata verification failed: ' + last);
          process.exit(1);
          JS
