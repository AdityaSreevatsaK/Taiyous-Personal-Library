# ONE-TIME production dispatcher authorised by the owner on 19 November 2026.
# This is not a permanent deployment trigger; remove it after successful release.
name: One-time approved publication ribbon release
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-time-approved-ribbon-deploy-20261119.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-guarded-cloudflare-release:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Verify this is exactly the owner-approved master revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed; refusing stale deployment.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo "Dispatched existing guarded Cloudflare Pages production workflow for $EXPECTED_SHA. It rechecks the build, security, offline reader and live metadata. No private HF dataset mutation or release tag." >> "$GITHUB_STEP_SUMMARY"
