name: Verify novel reader
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check published OAuth client metadata
        run: |
          test -s dist/.well-known/oauth-cimd
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/.well-known/oauth-cimd')); if(m.client_id!=='https://taiyous-personal-library.pages.dev/.well-known/oauth-cimd'||m.token_endpoint_auth_method!=='none') process.exit(1)"
      - name: Compile private Cloudflare Pages Functions
        run: |
          npx --yes wrangler@4 pages functions build functions --outfile /tmp/taiyou-functions.mjs --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat
          test -s /tmp/taiyou-functions.mjs
      - name: Prove the OAuth API fails closed without a session
        shell: bash
        run: |
          npx --yes wrangler@4 pages dev dist --ip 127.0.0.1 --port 8788 --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat > /tmp/taiyou-pages-dev.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          code=""
          for i in $(seq 1 35); do
            code="$(curl --silent --output /tmp/taiyou-api.json --write-out '%{http_code}' 'http://127.0.0.1:8788/api/library?action=session' || true)"
            if [ "$code" = "403" ] || [ "$code" = "503" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          echo "Private Pages Function unavailable or not deny-by-default. Status: $code"
          tail -60 /tmp/taiyou-pages-dev.log
          exit 1
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser smoke test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile, offline cold launch and advanced search
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_smoke.mjs
      - name: Inventory development dependency advisories
        shell: bash
        run: |
          npm audit --audit-level=low --json > /tmp/taiyou-audit.json || true
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/taiyou-audit.json','utf8'));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            console.log(`${v.severity.toUpperCase()} ${name} ${v.range || ''} fixAvailable=${JSON.stringify(v.fixAvailable)} direct=${v.isDirect}`);
          }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Total vulnerabilities by severity: ' + JSON.stringify(counts));
          if ((counts.high || 0) + (counts.critical || 0) > 0) {
            console.error('CI blocked: high or critical npm advisories require remediation.');
            process.exit(1);
          }
          JS
