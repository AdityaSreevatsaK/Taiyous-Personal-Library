name: Verify novel reader
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Emit npm lockfile for controlled reproducible installation
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          node - <<'JS'
          const fs = require('node:fs');
          console.log('TAIYOU_LOCK_BEGIN');
          for (const line of fs.readFileSync('package-lock.json', 'utf8').split('\n')) {
            console.log('TAIYOU_LOCK_LINE ' + line);
          }
          console.log('TAIYOU_LOCK_END');
          JS
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate production package privacy and OAuth metadata
        run: python scripts/check_deployment_package.py
      - name: Check published OAuth client metadata
        run: |
          test -s dist/oauth-client.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/oauth-client.json')); if(m.client_id!=='https://taiyous-personal-library.pages.dev/oauth-client.json'||m.token_endpoint_auth_method!=='none') process.exit(1)"
      - name: Compile private Cloudflare Pages Functions
        run: |
          npx --yes wrangler@4 pages functions build functions --outfile /tmp/taiyou-functions.mjs --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat
          test -s /tmp/taiyou-functions.mjs
      - name: Prove Cloudflare Pages serves client metadata as small JSON (not SPA HTML)
        shell: bash
        run: |
          npx --yes wrangler@4 pages dev dist --ip 127.0.0.1 --port 8789 --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat > /tmp/taiyou-metadata-pages.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          ok=0
          for i in $(seq 1 35); do
            if curl --silent --fail --dump-header /tmp/taiyou-metadata-headers --output /tmp/taiyou-metadata.json 'http://127.0.0.1:8789/oauth-client.json'; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "Cloudflare Pages failed to serve OAuth metadata"
            tail -50 /tmp/taiyou-metadata-pages.log
            exit 1
          fi
          node - <<'JS'
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/taiyou-metadata.json');
          const headers = fs.readFileSync('/tmp/taiyou-metadata-headers', 'utf8');
          if (body.length > 5120 || !/content-type:\s*application\/json/i.test(headers)) {
            throw new Error('Cloudflare Pages did not serve small JSON OAuth metadata: ' + headers);
          }
          const value = JSON.parse(body.toString('utf8'));
          if (value.client_id !== 'https://taiyous-personal-library.pages.dev/oauth-client.json' ||
              value.redirect_uris?.[0] !== 'https://taiyous-personal-library.pages.dev/api/oauth/callback') {
            throw new Error('OAuth Client ID or redirect does not match the public metadata URL');
          }
          JS
      - name: Prove the OAuth API fails closed without a session
        shell: bash
        run: |
          npx --yes wrangler@4 pages dev dist --ip 127.0.0.1 --port 8788 --compatibility-date 2026-11-10 --compatibility-flags nodejs_compat > /tmp/taiyou-pages-dev.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          code=""
          for i in $(seq 1 35); do
            code="$(curl --silent --output /tmp/taiyou-api.json --write-out '%{http_code}' 'http://127.0.0.1:8788/api/library?action=session' || true)"
            if [ "$code" = "403" ] || [ "$code" = "503" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 1
          done
          echo "Private Pages Function unavailable or not deny-by-default. Status: $code"
          tail -60 /tmp/taiyou-pages-dev.log
          exit 1
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser smoke test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          # Avoid apt-get --with-deps: runner mirror DNS failures should not break browser checks.
          # ubuntu-24.04 hosted runners already include shared browser runtime libraries.
          npx playwright install chromium
      - name: Test desktop, mobile, offline cold launch and advanced search
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_smoke.mjs
      - name: Diagnose the public production OAuth metadata externally
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = 'https://taiyous-personal-library.pages.dev/oauth-client.json';
          try {
            const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(20000) });
            const type = response.headers.get('content-type') || '';
            const location = response.headers.get('location');
            const body = await response.text();
            console.log('Production response status:', response.status);
            console.log('Production Content-Type:', type);
            console.log('Production response size:', Buffer.byteLength(body), 'bytes');
            if (location) {
              const next = new URL(location, url);
              console.log('Production redirect destination:', next.origin + next.pathname);
            }
            if (response.ok && type.toLowerCase().includes('application/json')) {
              try {
                const metadata = JSON.parse(body);
                console.log('OAuth client ID matches:', metadata.client_id === url);
                console.log('Provider 5-KiB size limit passes:', Buffer.byteLength(body) <= 5120);
              } catch {
                console.log('OAuth metadata response is not valid JSON');
              }
            } else {
              console.log('Cloudflare Access marker:', /cloudflare access|cf-access|access\.cloudflare|zero trust/i.test(body));
              console.log('SPA HTML marker:', /<div id="root"|<script type="module"|\/assets\/index-/i.test(body));
              console.log('HTML response marker:', /<!doctype html|<html/i.test(body));
              console.log('::warning::Production OAuth endpoint did not return small JSON; check Cloudflare Access or production routing');
            }
          } catch (error) {
            console.log('::warning::Production metadata could not be fetched from GitHub Actions: ' + String(error));
          }
          JS
      - name: Inventory development dependency advisories
        shell: bash
        run: |
          npm audit --audit-level=low --json > /tmp/taiyou-audit.json || true
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/taiyou-audit.json','utf8'));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            console.log(`${v.severity.toUpperCase()} ${name} ${v.range || ''} fixAvailable=${JSON.stringify(v.fixAvailable)} direct=${v.isDirect}`);
          }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Total vulnerabilities by severity: ' + JSON.stringify(counts));
          if ((counts.high || 0) + (counts.critical || 0) > 0) {
            console.error('CI blocked: high or critical npm advisories require remediation.');
            process.exit(1);
          }
          JS
