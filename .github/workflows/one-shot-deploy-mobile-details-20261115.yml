# Reusable guarded production deployment trigger for owner-approved, CI-verified master changes.
name: "One-shot: deploy approved master changes"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-mobile-details-20261115.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-verified-production-deployment:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Deploy exact verified master commit only
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed; refusing stale deployment.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Triggered guarded Cloudflare deployment after verified PR #20 Sun-branded details header. Private data unchanged and no v1.0 tag.' >> "$GITHUB_STEP_SUMMARY"
