name: CodeQL security analysis
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  javascript-typescript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:javascript-typescript
      - name: Diagnose PR code-scanning location without reading private data
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const file = '../results/javascript.sarif';
          if (!existsSync(file)) { console.log('SARIF not found at expected path'); process.exit(0); }
          const report = JSON.parse(readFileSync(file, 'utf8'));
          for (const run of report.runs || []) {
            for (const item of run.results || []) {
              const point = item.locations?.[0]?.physicalLocation;
              const path = point?.artifactLocation?.uri || '';
              if (!path.includes('isolated_oauth_browser_acceptance.mjs')) continue;
              console.log('ISOLATED_CODEQL_DIAGNOSTIC', JSON.stringify({
                rule: item.ruleId,
                level: item.level,
                line: point?.region?.startLine,
                description: String(item.message?.text || '').slice(0, 220),
              }));
            }
          }
          JS
