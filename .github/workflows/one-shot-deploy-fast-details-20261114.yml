# One-shot, owner-requested deployment of the verified novel-details colour and latency fix.
name: "One-shot: deploy fast novel details and colourways"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-fast-details-20261114.yml
permissions:
  contents: read
  actions: write
jobs:
  request-production-deployment:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch existing validation-gated production workflow
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master advanced; refusing a stale production deployment.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Requested production deploy for instant details/colourway fix. EPUB and private dataset remain untouched.' >> "$GITHUB_STEP_SUMMARY"
