# One-time guarded deployment of verified Master Controls and chapter fixes.
# Triggered only when this exact file is introduced on master.
# Never creates a version tag or mutates private Hugging Face novel data.
name: "One-shot: deploy chapter and master fixes"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-master-followup-20261115.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch exact master revision only
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed. Refusing to deploy a stale revision.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Guarded Cloudflare Pages deployment requested after PR #29, no v1.0 tag and no private novel-data writes.' >> "$GITHUB_STEP_SUMMARY"
