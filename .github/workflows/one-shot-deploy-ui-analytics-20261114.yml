# One-time owner-requested deployment of verified UI refinements and local analytics.
name: "One-shot: deploy analytics and library UI fixes"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-ui-analytics-20261114.yml
permissions:
  contents: read
  actions: write
jobs:
  deploy-approved-ui:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Request existing fully validated production deployment at exact master
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master advanced; cancelling stale deployment.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Requested guarded production Deploy Application. No private dataset writes.' >> "$GITHUB_STEP_SUMMARY"
