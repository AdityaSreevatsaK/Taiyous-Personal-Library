name: Verify Disposable Hugging Face Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiyou-hf-disposable-acceptance
  cancel-in-progress: false

jobs:
  verify-private-cas:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_DISPOSABLE_TEST_TOKEN: ${{ secrets.HF_DISPOSABLE_TEST_TOKEN }}
    steps:
      # Run only the isolated helper on the approved sync PR branch. The
      # checkout has no write credential and cannot modify the GitHub repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/revision-aware-personal-sync-20261111
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require a DEDICATED, non-production Hugging Face test secret
        run: |
          if [ -z "$HF_DISPOSABLE_TEST_TOKEN" ]; then
            echo '::error::HF_DISPOSABLE_TEST_TOKEN is not set. Do not use the production novel-storage token.'
            echo 'Configure a dedicated disposable-dataset token as a GitHub Actions repository secret.'
            exit 1
          fi
      - name: Install Hugging Face integration dependency
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.28,<2'
      - name: Execute real private-dataset optimistic-concurrency checks
        run: |
          python scripts/hf_disposable_integration.py
          echo '✅ Real Hub test passed. This does NOT verify the separate browser OAuth gateway.' >> "$GITHUB_STEP_SUMMARY"
