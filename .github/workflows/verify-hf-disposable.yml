name: Verify Disposable Hugging Face Dataset

on:
  push:
    # Allow the opt-in test to execute against this exact draft commit
    # without putting any application/data migration code on master.
    branches: [feature/bulk-personal-state-revision-sync-20261121]
    paths: [.github/workflows/verify-hf-disposable.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiyou-hf-disposable-acceptance
  cancel-in-progress: false

jobs:
  verify-private-cas:
    # Explicit branch dispatch allows validating the draft WITHOUT merging.
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/bulk-personal-state-revision-sync-20261121')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_DISPOSABLE_TEST_TOKEN: ${{ secrets.HF_DISPOSABLE_TEST_TOKEN }}
    steps:
      # Run only the isolated helper from the explicitly selected ref. The
      # checkout has no write credential and cannot modify the GitHub repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin checkout to the workflow-dispatched commit, never a moving external ref.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Detect a DEDICATED, non-production Hugging Face test secret
        id: token
        run: |
          if [ -z "$HF_DISPOSABLE_TEST_TOKEN" ]; then
            echo 'available=no' >> "$GITHUB_OUTPUT"
            echo '::warning::HF_DISPOSABLE_TEST_TOKEN is missing: real-HF test NOT executed. Never use the production novel-storage token.'
          else
            echo 'available=yes' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Hugging Face integration dependency
        if: steps.token.outputs.available == 'yes'
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.28,<2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.available == 'yes'
        with:
          node-version: '22'
      - name: Install exact integration-test dependencies
        if: steps.token.outputs.available == 'yes'
        run: npm ci --no-fund --no-audit
      - name: Execute real private-dataset optimistic-concurrency checks
        if: steps.token.outputs.available == 'yes'
        run: |
          python scripts/hf_disposable_integration.py
          echo 'Real private Hugging Face CAS test PASSED; browser OAuth gateway is a separate gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the blocked integration gate without a false pass
        if: steps.token.outputs.available == 'no'
        run: |
          echo 'BLOCKED: no HF_DISPOSABLE_TEST_TOKEN configured. The integration check was NOT run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not merge bulk-state PR #110 or tag a release solely from simulated CI.' >> "$GITHUB_STEP_SUMMARY"
