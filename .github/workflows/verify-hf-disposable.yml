name: Verify Disposable Hugging Face Dataset

on:
  push:
    branches: [master]
    paths: [.github/workflows/verify-hf-disposable.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taiyou-hf-disposable-acceptance
  cancel-in-progress: false

jobs:
  verify-private-cas:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_DISPOSABLE_TEST_TOKEN: ${{ secrets.HF_DISPOSABLE_TEST_TOKEN }}
    steps:
      # Run only the isolated helper on the approved sync PR branch. The
      # checkout has no write credential and cannot modify the GitHub repo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/revision-aware-personal-sync-20261111
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Detect a DEDICATED, non-production Hugging Face test secret
        id: token
        run: |
          if [ -z "$HF_DISPOSABLE_TEST_TOKEN" ]; then
            echo 'available=no' >> "$GITHUB_OUTPUT"
            echo '::warning::HF_DISPOSABLE_TEST_TOKEN is missing: real-HF test NOT executed. Never use the production novel-storage token.'
          else
            echo 'available=yes' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Hugging Face integration dependency
        if: steps.token.outputs.available == 'yes'
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.28,<2'
      - name: Execute real private-dataset optimistic-concurrency checks
        if: steps.token.outputs.available == 'yes'
        run: |
          python scripts/hf_disposable_integration.py
          echo 'Real private Hugging Face CAS test PASSED; browser OAuth gateway is a separate gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the blocked integration gate without a false pass
        if: steps.token.outputs.available == 'no'
        run: |
          echo 'BLOCKED: no HF_DISPOSABLE_TEST_TOKEN configured. The integration check was NOT run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not merge the sync PR or tag v1.0.0 solely from this workflow.' >> "$GITHUB_STEP_SUMMARY"
