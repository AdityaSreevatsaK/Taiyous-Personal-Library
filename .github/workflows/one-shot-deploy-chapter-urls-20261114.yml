# One-shot owner-approved deployment of tested chapter-specific reader URLs.
name: "One-shot: deploy chapter-aware reader URLs"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-chapter-urls-20261114.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-existing-production-workflow:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Deploy only the exact tested master using production validation gates
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed. Refusing stale deployment.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Requested guarded production deployment of chapter-numbered reader URLs. No private novel data modification.' >> "$GITHUB_STEP_SUMMARY"
