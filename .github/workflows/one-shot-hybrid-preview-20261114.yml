# One-time user-requested preview. No production deployment and no private data.
name: "One-shot: publish interactive hybrid library preview"

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-hybrid-preview-20261114.yml

permissions:
  contents: read

concurrency:
  group: taiyou-hybrid-preview
  cancel-in-progress: false

jobs:
  verify-synthetic-preview:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Fetch pinned isolated preview source, NEVER production checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e47e7c9ea81e90c99552c8158c687a3137cafa4a
          persist-credentials: false
      - id: source
        name: Assert source revision and repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'e47e7c9ea81e90c99552c8158c687a3137cafa4a'
          test "${{ github.repository }}" = 'AdityaSreevatsaK/Taiyous-Personal-Library'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install and run existing full unit suite
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build fictional-only preview; never package private Pages Functions
        env:
          VITE_DESIGN_PREVIEW: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          python scripts/check_deployment_package.py
          test -s dist/index.html
          test -s dist/sw.js
          test ! -d dist/functions
          cp scripts/standalone-headers.txt dist/_headers
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers
      - name: Install Chromium and verify the actual clickable demo on desktop and phone
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/taiyou-hybrid-preview.log 2>&1 &
          ready=0
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { tail -60 /tmp/taiyou-hybrid-preview.log; exit 1; }
          node scripts/browser_hybrid_preview_smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hybrid-fictional-preview-${{ steps.source.outputs.revision }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    needs: verify-synthetic-preview
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: standalone-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SOURCE_REVISION: ${{ needs.verify-synthetic-preview.outputs.revision }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hybrid-fictional-preview-${{ needs.verify-synthetic-preview.outputs.revision }}
          path: preview-dist
      - name: Confirm preview destination is NOT production and contains no Functions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CF_PAGES_PROJECT" = 'taiyous-personal-library'
          test "$SOURCE_REVISION" = 'e47e7c9ea81e90c99552c8158c687a3137cafa4a'
          test ! -d preview-dist/functions
          test -s preview-dist/_headers
          test -s preview-dist/index.html
      - name: Publish STATIC files to Cloudflare preview branch only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hybrid-preview-only"
          cp -a preview-dist/. "$RUNNER_TEMP/hybrid-preview-only/"
          cd "$RUNNER_TEMP/hybrid-preview-only"
          test ! -d functions
          npx --yes wrangler@4 pages deploy . \
            --project-name "$CF_PAGES_PROJECT" \
            --branch hybrid-preview \
            --commit-hash "$SOURCE_REVISION"
      - name: Check the public preview URL and report access status
        shell: bash
        run: |
          url='https://hybrid-preview.taiyous-personal-library.pages.dev/'
          echo "Clickable hybrid preview (fictional books only): $url" >> "$GITHUB_STEP_SUMMARY"
          code="$(curl -L --silent --output /tmp/hybrid-preview.html --write-out '%{http_code}' --max-time 25 "$url" || true)"
          echo "HTTP status: ${code:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 200 ]; then
            echo "::warning::Preview may be protected by Cloudflare Access or still propagating: HTTP ${code:-unavailable}"
          fi
