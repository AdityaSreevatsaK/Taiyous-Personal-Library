# One-time verified deployment for security PR #27 and library UX PR #28.
# This workflow triggers only when this specific file is introduced/changed on master.
# It never creates a version tag and does not touch private Hugging Face novel data.
name: "One-shot: deploy library audit and UX"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-library-audit-20261115.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch exact verified master revision only
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed. Refusing to deploy a stale revision.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Guarded Cloudflare Pages deployment requested after security #27 and library UX #28 integration. No v1.0 tag or private novel-data writes.' >> "$GITHUB_STEP_SUMMARY"
