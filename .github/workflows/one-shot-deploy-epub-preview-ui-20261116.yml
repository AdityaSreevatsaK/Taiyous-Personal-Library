# Guarded one-shot deployment trigger for the relaxed, six-column catalogue grid.
# Does not delete stored EPUBs, update private Hugging Face records or tag a release.
name: "One-shot: deploy verified library updates"
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-deploy-epub-preview-ui-20261116.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'AdityaSreevatsaK/Taiyous-Personal-Library' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Guard master revision before deployment
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq '.object.sha')"
          if [ "$current" != "$EXPECTED_SHA" ]; then
            echo '::error::Master changed. Refusing to deploy stale revision.'
            exit 1
          fi
          gh workflow run deploy-standalone.yml --repo "$GH_REPO" --ref master -f publish=true
          echo 'Guarded Cloudflare deployment requested for roomier six-column desktop catalogue and responsive grid checks. No EPUB deletion or release tag.' >> "$GITHUB_STEP_SUMMARY"
